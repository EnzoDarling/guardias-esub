<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Guardias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-fecha { transition: all 0.2s ease; }
        .reservado { background-color: #e9ecef; opacity: 0.75; }
    </style>
</head>
<body>
<!-- Barra de Navegación Unificada (Index) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            ⚓ Reserva de Guardias PNA
        </a>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-light btn-sm fw-bold active">
                🏠 Inicio
            </a>
            <a href="/admin" class="btn btn-warning btn-sm fw-bold">
                ⚙️ Gestionar
            </a>
        </div>
    </div>
</nav>
<div class="container py-4" style="max-width: 650px;">
    <div class="text-center mb-3">
        <h3 id="tituloMes" class="fw-bold text-primary">Guardias PNA</h3>
        <p class="text-muted small mb-2">Selección de Guardias</p>
    </div>

    <!-- Selector de Mes y Año -->
    <div class="card shadow-sm mb-3 bg-light border-primary">
        <div class="card-body p-2 d-flex align-items-center justify-content-center gap-2">
            <span class="fw-bold text-secondary small">Seleccionar Mes:</span>
            <select id="selectMes" class="form-select form-select-sm w-auto fw-bold text-primary">
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
            <select id="selectAño" class="form-select form-select-sm w-auto fw-bold text-primary">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
            <button onclick="cambiarMes()" class="btn btn-sm btn-primary fw-bold">Ver Fechas</button>
        </div>
    </div>

    <!-- 1. Datos del Agente -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h6 class="card-title fw-bold text-secondary mb-3">Datos del Agente</h6>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label small fw-bold">1. JERARQUÍA</label>
                    <select id="selectJerarquia" class="form-select">
                        <option value="" selected disabled>-- Seleccionar Jerarquía --</option>
                        <option value="AI">AI</option>
                        <option value="AS">AS</option>
                        <option value="AT">AT</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">2. APELLIDO</label>
                    <input type="text" id="inputApellido" class="form-control" placeholder="Ingrese Apellido">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">3. NOMBRE</label>
                    <input type="text" id="inputNombre" class="form-control" placeholder="Ingrese Nombre">
                </div>
            </div>
        </div>
    </div>

    <!-- Pestañas para los 2 tipos de Guardia -->
    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="pills-oficial-tab" data-bs-toggle="pill" data-bs-target="#pills-oficial" type="button" role="tab">
                🛡️ Guardia Oficial
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="pills-disponible-tab" data-bs-toggle="pill" data-bs-target="#pills-disponible" type="button" role="tab">
                🔄 Guardia Disponibles
            </button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <!-- SECCIÓN 1: GUARDIAS OFICIALES -->
        <div class="tab-pane fade show active" id="pills-oficial" role="tabpanel">
            <div class="alert alert-info py-2 small mb-3">
                Fechas correspondientes al Servicio de Guardia Turno Noche.
            </div>
            <div id="contenedorOficiales" class="row g-2"></div>
        </div>

        <!-- SECCIÓN 2: GUARDIAS DISPONIBLES (CUBRETURNOS) -->
        <div class="tab-pane fade" id="pills-disponible" role="tabpanel">
            <div class="alert alert-warning py-2 small mb-3">
                Fechas de Guardia Disponible Turno Noche.
            </div>
            <div id="contenedorDisponibles" class="row g-2"></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const socket = io();
    const contenedorOficiales = document.getElementById('contenedorOficiales');
    const contenedorDisponibles = document.getElementById('contenedorDisponibles');
    const tituloMes = document.getElementById('tituloMes');
    const selectMes = document.getElementById('selectMes');
    const selectAño = document.getElementById('selectAño');

    socket.on('connect', () => {
        socket.emit('obtenerFechas');
    });

    socket.on('cargarFechas', (data) => {
        procesarDatos(data);
    });

    socket.on('actualizarFechas', (data) => {
        procesarDatos(data);
    });

    function procesarDatos(data) {
        if (data.infoMes) {
            tituloMes.innerText = `Guardias ${data.infoMes.mesNombre} ${data.infoMes.año}`;
            selectMes.value = data.infoMes.mesNumero;
            selectAño.value = data.infoMes.año;
        }
        renderizarFechas(data.oficiales, contenedorOficiales, 'oficial');
        renderizarFechas(data.disponibles, contenedorDisponibles, 'disponible');
    }

    function cambiarMes() {
        const m = selectMes.value;
        const a = selectAño.value;
        socket.emit('solicitarCambioMes', { mes: m, año: a });
    }

    socket.on('resultadoReserva', (res) => {
        if (res.exito) {
            Swal.fire({
                icon: 'success',
                title: '¡Reserva Confirmada!',
                text: res.mensaje,
                confirmButtonColor: '#0d6efd'
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Atención',
                text: res.mensaje,
                confirmButtonColor: '#dc3545'
            });
        }
    });

    function renderizarFechas(fechas, contenedor, tipoGuardia) {
    if (!contenedor) return;
    contenedor.innerHTML = '';

    if (!fechas || fechas.length === 0) {
        contenedor.innerHTML = '<p class="text-center text-muted">No hay fechas disponibles.</p>';
        return;
    }

    fechas.forEach(f => {
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4';

        const esReservado = f.estado === 'reservado';
        const etiquetaAgente = esReservado ? '🔒 Reservado' : '🟢 Disponible';
        
        col.innerHTML = `
            <div class="card card-fecha h-100 ${esReservado ? 'reservado border-0' : 'border-primary'} text-center p-2">
                <span class="fw-bold fs-6 ${esReservado ? 'text-muted' : 'text-primary'}">${f.fecha}</span>
                <small class="d-block text-truncate mt-1 ${esReservado ? 'text-danger fw-bold' : 'text-success'}">
                    ${etiquetaAgente}
                </small>
                <button class="btn btn-sm ${esReservado ? 'btn-secondary disabled' : 'btn-primary'} mt-2 w-100" 
                        onclick="reservarFecha(${f.id}, '${tipoGuardia}')" ${esReservado ? 'disabled' : ''}>
                    ${esReservado ? 'Ocupado' : 'Reservar'}
                </button>
            </div>
        `;
        contenedor.appendChild(col);
    });
}

    function reservarFecha(idFecha, tipoGuardia) {
    const jerarquia = document.getElementById('selectJerarquia').value;
    const apellido = document.getElementById('inputApellido').value.trim();
    const nombre = document.getElementById('inputNombre').value.trim();
    const mes = document.getElementById('selectMes').value;
    const año = document.getElementById('selectAño').value;

    if (!jerarquia || !apellido || !nombre) {
        Swal.fire({
            icon: 'warning',
            title: 'Campos incompletos',
            text: 'Por favor complete Jerarquía, Apellido y Nombre antes de seleccionar una fecha.'
        });
        return;
    }

    // Enviamos el mes y año junto con la reserva para evitar cruces
    socket.emit('solicitarReserva', { 
        idFecha, 
        tipoGuardia, 
        jerarquia, 
        apellido, 
        nombre,
        mes,
        año
    });
}
</script>

</body>
</html>
